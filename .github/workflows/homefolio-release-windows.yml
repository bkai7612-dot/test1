# Builds the Windows installer, signs it (if signing is set up), and publishes it
# with the auto-update feed to the public "homefolio-releases" repository.
#
# Start it by pushing a tag like v1.0.0, or from the Actions tab.
# The release is created as a DRAFT: check it on GitHub, then press Publish.
name: Homefolio Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    environment: production
    defaults:
      run:
        working-directory: homefolio
        shell: bash
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_WEBSITE_URL: ${{ vars.VITE_WEBSITE_URL }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      RELEASES_REPO: ${{ vars.RELEASES_REPO || 'bkai7612-dot/homefolio-releases' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homefolio/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: homefolio/src-tauri -> target

      - run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Point auto-updates at the releases repository
        run: |
          echo "{\"plugins\":{\"updater\":{\"endpoints\":[\"https://github.com/${RELEASES_REPO}/releases/latest/download/latest.json\"]}}}" > src-tauri/tauri.release.conf.json

      # --- Code signing (optional). Set the repository variable WINDOWS_SIGNING to
      # "azure" (Azure Artifact Signing) or "sslcom" (SSL.com eSigner) once you have one.
      - name: Signing with Azure Artifact Signing
        if: vars.WINDOWS_SIGNING == 'azure'
        env:
          AZURE_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --locked
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.release.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.bundle = { windows: { signCommand: 'trusted-signing-cli -e ' + process.env.AZURE_ENDPOINT + ' -a ' + process.env.AZURE_ACCOUNT + ' -c ' + process.env.AZURE_PROFILE + ' -d Homefolio %1' } };
            fs.writeFileSync(f, JSON.stringify(c));
          "

      - name: Signing with SSL.com eSigner
        if: vars.WINDOWS_SIGNING == 'sslcom'
        run: |
          curl -fsSL -o CodeSignTool.zip https://www.ssl.com/download/codesigntool-for-windows/
          mkdir -p "$RUNNER_TEMP/CodeSignTool" && unzip -q CodeSignTool.zip -d "$RUNNER_TEMP/CodeSignTool"
          TOOL=$(find "$RUNNER_TEMP/CodeSignTool" -name 'CodeSignTool.bat' | head -1)
          cat > "$RUNNER_TEMP/sign.cmd" <<EOS
          @echo off
          call "$TOOL" sign -username=%ES_USERNAME% -password=%ES_PASSWORD% -credential_id=%ES_CREDENTIAL_ID% -totp_secret=%ES_TOTP_SECRET% -input_file_path=%1 -override
          EOS
          SIGN=$(cygpath -w "$RUNNER_TEMP/sign.cmd" | sed 's/\\/\\\\/g')
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.release.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.bundle = { windows: { signCommand: '$SIGN %1' } };
            fs.writeFileSync(f, JSON.stringify(c));
          "

      - name: Build, sign and publish (draft)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        with:
          projectPath: homefolio
          args: --config src-tauri/tauri.release.conf.json
          owner: ${{ github.repository_owner }}
          repo: ${{ vars.RELEASES_REPO_NAME || 'homefolio-releases' }}
          tagName: v__VERSION__
          releaseName: Homefolio __VERSION__
          releaseBody: |
            Download **Homefolio___VERSION___x64-setup.exe** below, open it, and Homefolio installs and opens by itself.
            Installed copies update automatically.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      # A copy with a fixed name, so the website's download button never changes.
      - name: Add fixed-name installer for the website
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$EXE" Homefolio-Setup.exe
          gh release upload "v$VERSION" Homefolio-Setup.exe --repo "$RELEASES_REPO" --clobber
