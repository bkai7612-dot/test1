# Checks every change to Homefolio: types, the web build and the prototype build.
name: Homefolio CI

on:
  pull_request:
    paths: ['homefolio/**', '.github/workflows/homefolio-*.yml']
  push:
    branches: [main]
    paths: ['homefolio/**', '.github/workflows/homefolio-*.yml']

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homefolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homefolio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npm run build:demo
