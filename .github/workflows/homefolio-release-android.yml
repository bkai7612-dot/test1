# Builds the signed Android App Bundle (.aab) for Google Play.
# If the Play service account secret is set, it also uploads it to the
# Internal testing track; otherwise download it from the run's Artifacts.
name: Homefolio Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: homefolio
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_WEBSITE_URL: ${{ vars.VITE_WEBSITE_URL }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      VITE_REVENUECAT_ANDROID_KEY: ${{ vars.VITE_REVENUECAT_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homefolio/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./package.json').version"); fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Build the app and copy it into the Android project
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Restore upload key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed App Bundle
        working-directory: homefolio/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.version.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: homefolio-android-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: homefolio/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play (Internal testing)
        if: vars.PLAY_AUTO_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.co.homefolio.app
          releaseFiles: homefolio/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
