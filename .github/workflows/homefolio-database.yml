# Applies database migrations and deploys the payment webhook to Supabase.
# Run it by hand from the Actions tab whenever supabase/ changes.
name: Homefolio database

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Supabase project
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    defaults:
      run:
        working-directory: homefolio
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy payment webhook
        run: supabase functions deploy revenuecat-webhook --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --no-verify-jwt
